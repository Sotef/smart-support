version: '3.8'

services:
  smart-support:
    build: .
    container_name: smart-support-app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - SCIBOX_URL=http://scibox:8001
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://smartsupport:password123@postgres:5432/smartsupport_db
    depends_on:
      - redis
      - postgres
    networks:
      - smart-support-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis для кэширования и очередей
  redis:
    image: redis:7-alpine
    container_name: smart-support-redis
    ports:
      - "6379:6379"
    networks:
      - smart-support-network
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # PostgreSQL для хранения данных (опционально)
  postgres:
    image: postgres:15-alpine
    container_name: smart-support-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smartsupport_db
      POSTGRES_USER: smartsupport
      POSTGRES_PASSWORD: password123
    networks:
      - smart-support-network
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Scibox Mock Service (эмуляция Scibox API)
  scibox-mock:
    image: python:3.11-slim
    container_name: smart-support-scibox-mock
    ports:
      - "8001:8001"
    networks:
      - smart-support-network
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./scibox-mock:/app
    command: >
      sh -c "
        pip install fastapi uvicorn pydantic &&
        python mock_scibox.py
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8001/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx для проксирования (опционально)
  nginx:
    image: nginx:alpine
    container_name: smart-support-nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - smart-support-network
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - smart-support

  # Мониторинг с Prometheus (опционально)
  prometheus:
    image: prom/prometheus:latest
    container_name: smart-support-prometheus
    ports:
      - "9090:9090"
    networks:
      - smart-support-network
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana для визуализации метрик (опционально)
  grafana:
    image: grafana/grafana:latest
    container_name: smart-support-grafana
    ports:
      - "3000:3000"
    networks:
      - smart-support-network
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana

networks:
  smart-support-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local